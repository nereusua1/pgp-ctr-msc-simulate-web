    .brand{display:flex;align-items:center;gap:11px;padding:0 9px 28px}.mark{position:relative;display:grid;width:38px;height:38px;place-items:center;overflow:hidden;border-radius:12px;background:var(--ink);color:#fff;font-weight:760;letter-spacing:-.06em}.mark:after{position:absolute;right:-7px;bottom:-7px;width:20px;height:20px;border-radius:50%;background:#648cff;content:""}.brand b,.brand small{display:block}.brand b{font-size:14px}.brand small{margin-top:2px;color:#97a3b5;font-size:8px;letter-spacing:.12em}.nav-label{padding:6px 11px;color:#a0aaba;font-size:9px;font-weight:720;letter-spacing:.1em}.nav button{display:flex;width:100%;align-items:center;gap:11px;margin:3px 0;padding:10px 11px;border-radius:10px;background:transparent;color:#69768b;text-align:left}.nav button:hover{background:#f1f4f9;color:#33445f}.nav button.active{background:var(--blue-soft);color:#2857c6;font-weight:650}.nav button.active:after{width:5px;height:5px;margin-left:auto;border-radius:50%;background:#3569e8;content:""}.env{margin-top:auto;padding:13px;border:1px solid var(--line);border-radius:14px;background:#f8fafc}.env span{display:flex;align-items:center;gap:7px;color:#59677c;font-size:10px}.env span:before{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px #15956a18;content:""}.env small{display:block;margin-top:6px;color:#99a5b5;font-size:9px}

    .summary-list{display:grid;gap:0;padding:0 16px 15px}.summary-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid #eef1f5}.summary-row span{color:#8d98a9;font-size:8px}.summary-row b{max-width:180px;color:#48566d;font-size:9px;text-align:right}.readiness{padding:13px 16px;border-top:1px solid #edf0f5}.readiness-head{display:flex;justify-content:space-between;color:#657187;font-size:9px}.progress{height:5px;margin-top:8px;overflow:hidden;border-radius:99px;background:#ebeff5}.progress i{display:block;width:71%;height:100%;border-radius:inherit;background:var(--green)}

  <aside class="sidebar"><div class="brand"><span class="mark">MS</span><div><b>报文模拟系统</b><small>MESSAGE SIMULATION</small></div></div><div class="nav-label">工作空间</div><nav class="nav"><button><svg class="icon"><use href="#grid"/></svg><span>运行总览</span></button><button><svg class="icon"><use href="#task"/></svg><span>任务管理</span></button><button class="active"><svg class="icon"><use href="#file"/></svg><span>报文管理</span></button><button><svg class="icon"><use href="#data"/></svg><span>数据项管理</span></button><button><svg class="icon"><use href="#node"/></svg><span>消息组件管理</span></button><button><svg class="icon"><use href="#log"/></svg><span>执行日志</span></button></nav><div class="env"><span>测试环境运行正常</span><small>RocketMQ 首链路 · 服务在线</small></div></aside>
  <div class="shell"><header class="topbar"><div class="crumb">测试环境　/　报文管理　/　<b>气象标准报文</b></div><div class="account"><div class="search"><svg class="icon sm"><use href="#search"/></svg>搜索报文或编码</div><span class="online">服务在线</span><span class="avatar">NA</span></div></header><main class="content"><header class="heading"><div><p class="eyebrow">MESSAGE WORKBENCH</p><h1>气象标准报文</h1><p>配置数据来源、生成规则与最终投递目标。</p></div><div class="actions"><span class="status draft">草稿 · v5</span><button class="button" data-act="preview">生成样例</button><button class="button primary" data-act="save">保存草稿</button></div></header><div id="prototype"></div></main></div>

  <script>
    const variants=[{key:'a',label:'A · 线性步骤工作台'},{key:'b',label:'B · 顶部流程画布'},{key:'c',label:'C · 发布证据工作台'}]
    const steps=[['basic','基础信息','已完成'],['content','报文内容','已完成'],['data','数据关联','进行中'],['time','时间绑定','未完成'],['values','系统值绑定','未完成'],['targets','投递目标','未完成'],['publish','发布检查','未完成']]
    let current=Math.max(0,variants.findIndex(x=>x.key===new URLSearchParams(location.search).get('variant'))),active='data',toastTimer
    const icons={basic:'file',content:'grid',data:'data',time:'log',values:'task',targets:'node',publish:'check'}
    function stepButtons(cls='step-list'){return `<div class="${cls}">${steps.map(([key,name,state],i)=>`<button data-step="${key}" class="${key===active?'active ':''}${i<2?'done':''}"><span class="step-dot">${i<2?'✓':i+1}</span><span class="step-copy"><b>${name}</b><small>${key===active?'正在配置':state}</small></span></button>`).join('')}</div>`}
    function rail(){return `<div class="step-rail">${steps.map(([key,name],i)=>`${i?'<i class="rail-line"></i>':''}<button class="rail-step ${key===active?'active':''}" data-step="${key}">${i+1}　${name}</button>`).join('')}</div>`}
    function library(){return `<article class="card"><header class="card-head"><div><h2>报文资源库</h2><p>12 个报文 · 3 个草稿</p></div></header><div class="library-list"><button class="library-item selected"><b>气象标准报文</b><small>JSON · 草稿 v5</small><code>MSG-WEATHER-001</code></button><button class="library-item"><b>污染短临预报</b><small>JSON · 已发布 v4</small><code>MSG-FORECAST-002</code></button><button class="library-item"><b>风电功率文件引用</b><small>FILE · 已发布 v2</small><code>MSG-ENERGY-003</code></button></div></article>`}
    function catalogs(){return `<div class="catalog-grid"><section class="catalog"><h3><span>1</span>选择数据源</h3><p>确定报文所使用的业务数据来源。</p><input value="江苏物联管理中心"><div class="options"><button class="option selected"><code>2002332</code><b>江苏物联管理中心</b><small>18 个数据项</small></button><button class="option"><code>2002441</code><b>河北物联管理中心</b><small>12 个数据项</small></button></div></section><section class="catalog"><h3><span>2</span>选择数据项</h3><p>仅显示当前数据源提供的数据项。</p><input value="气象观测"><div class="options"><button class="option selected"><code>WEATHER_OBS</code><b>气象观测数据</b><small>24 个要素</small></button><button class="option"><code>STATION_BASE</code><b>站点基础信息</b><small>9 个要素</small></button></div></section><section class="catalog"><h3><span>3</span>选择要素项</h3><p>选择参与最终报文生成的字段。</p><input placeholder="搜索要素编码或名称"><div class="options element-list"><label class="element selected"><input checked type="checkbox">站点编码</label><label class="element selected"><input checked type="checkbox">观测时间</label><label class="element selected"><input checked type="checkbox">气温</label><label class="element selected"><input checked type="checkbox">相对湿度</label><label class="element"><input type="checkbox">风速</label><label class="element"><input type="checkbox">气压</label></div></section></div>`}
    function basic(){return `<div class="field-grid"><label class="field">报文名称<input value="气象标准报文"><small>用于任务选择和执行记录展示。</small></label><label class="field">报文编码<input value="MSG-WEATHER-001"><small>创建后不可修改。</small></label><label class="field">报文类型<select><option>JSON 报文</option><option>FILE 报文</option></select></label><label class="field">当前状态<select><option>草稿</option><option>已发布</option></select></label></div>`}
    function editor(){return `<label class="field">JSON 报文内容<textarea>{
  "stationCode": "\${station_code}",
  "observedAt": "\${observed_at}",
  "temperature": \${temperature},
  "humidity": \${humidity}
}</textarea><small>变量路径将在数据关联和系统值绑定中完成映射。</small></label>`}
    function activeContent(){const map={basic,content:editor,data:catalogs,time:()=>`<div class="notice"><b>识别到 1 个日期字段：</b> observedAt · yyyy-MM-dd HH:mm:ss</div><div class="field-grid" style="margin-top:14px"><label class="field">业务时间策略<select><option>使用任务计划触发时间</option></select></label><label class="field">时间格式<input value="yyyy-MM-dd HH:mm:ss"></label></div>`,values:()=>`<div class="notice">系统不会自动猜测字段含义。请明确选择 UUID、执行时间、序列号或固定值。</div><div class="field-grid" style="margin-top:14px"><label class="field">报文字段路径<input value="$.metadata.messageId"></label><label class="field">值来源<select><option>Execution UUID</option><option>固定值</option></select></label></div>`,targets:()=>`<div class="field-grid"><label class="field">MQ 实例<select><option>RocketMQ-Test</option></select></label><label class="field">Producer Group<select><option>simulate-test-producer</option></select></label><label class="field">Topic<select><option>weather-data-topic</option></select></label><label class="field">路由验证<input value="已验证 · 43 ms" readonly></label></div>`,publish:()=>`<div class="notice warning"><b>发布前还有 3 项未完成：</b>时间绑定、系统值绑定、投递目标验证。</div>`};return map[active]()}
    function summary(){return `<article class="card a-summary"><header class="card-head"><div><h2>配置摘要</h2><p>随编辑持续更新</p></div><span class="status draft">71%</span></header><div class="summary-list"><div class="summary-row"><span>报文类型</span><b>JSON</b></div><div class="summary-row"><span>数据来源</span><b>江苏物联管理中心</b></div><div class="summary-row"><span>数据项</span><b>气象观测数据</b></div><div class="summary-row"><span>已选要素</span><b>4 项</b></div><div class="summary-row"><span>投递目标</span><b>尚未验证</b></div></div><div class="readiness"><div class="readiness-head"><span>发布准备度</span><b>5 / 7</b></div><div class="progress"><i></i></div></div></article>`}
    function A(){return `<div class="variant active layout-a"><article class="card a-steps">${stepButtons()}</article><article class="card a-main"><div class="panel-title"><div><h2>${steps.find(x=>x[0]===active)[1]}</h2><p>完成当前配置后进入下一步，草稿可以随时保存。</p></div><span class="status draft">进行中</span></div>${activeContent()}</article>${summary()}</div>`}
    function B(){return `<div class="variant active layout-b">${library()}<article class="card b-canvas">${rail()}<div class="b-body"><section class="b-editor"><div class="panel-title"><div><h2>${steps.find(x=>x[0]===active)[1]}</h2><p>在画布中配置，右侧持续展示最终报文和影响范围。</p></div></div>${activeContent()}</section><aside class="b-preview"><span class="status">实时预览</span><div class="preview-card"><h3>生成结果</h3><pre>{
  "stationCode": "58012",
  "observedAt": "2026-09-01 14:42:00",
  "temperature": 28.6,
  "humidity": 73
}</pre></div><div class="preview-card"><h3>当前影响</h3><p class="muted">3 个任务引用已发布 v4；本草稿在发布并由任务显式选择前不会影响现有 Execution。</p></div></aside></div></article></div>`}
    function checklist(){return `<article class="card"><header class="card-head"><div><h2>发布清单</h2><p>按验证状态组织配置</p></div></header><div class="checklist">${steps.map(([key,name],i)=>`<button class="check-row ${key===active?'active':i>1?'pending':''}" data-step="${key}"><span class="check-icon">${i<2?'✓':i+1}</span><span><b>${name}</b><small>${i<2?'校验通过':key===active?'正在处理':'等待配置'}</small></span></button>`).join('')}</div></article>`}
    function C(){return `<div class="variant active layout-c"><div class="c-left">${library()}${checklist()}</div><article class="card c-main"><section class="c-focus"><div class="panel-title"><div><h2>${steps.find(x=>x[0]===active)[1]}</h2><p>先解决影响发布的问题，再处理可选配置。</p></div></div>${activeContent()}</section><aside class="c-evidence"><span class="status">5 项通过</span><h2 style="margin-top:13px">发布证据</h2><p>系统在这里持续记录配置为什么可以发布。</p><div class="evidence-item"><i></i><div><b>报文结构合法</b><small>JSON AST · 4 个字段</small></div></div><div class="evidence-item"><i></i><div><b>数据关系可解析</b><small>来源 2002332 · 4 个要素</small></div></div><div class="evidence-item pending"><i></i><div><b>时间绑定待完成</b><small>observedAt 尚未应用策略</small></div></div><div class="evidence-item pending"><i></i><div><b>投递目标待验证</b><small>需要验证 MQ 实例和 Topic</small></div></div></aside></article></div>`}
    function render(){document.getElementById('prototype').innerHTML=[A,B,C][current]();document.getElementById('variant-label').textContent=variants[current].label;const url=new URL(location.href);url.searchParams.set('variant',variants[current].key);history.replaceState(null,'',url)}
    function showToast(text){const toast=document.getElementById('toast');toast.textContent=text;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2200)}
    document.addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;if(button.dataset.step){active=button.dataset.step;render()}if(button.dataset.act==='save')showToast('草稿已保存在原型内存中。');if(button.dataset.act==='preview')showToast('已生成一条只读样例报文。')})
    document.getElementById('prev').onclick=()=>{current=(current+2)%3;render()};document.getElementById('next').onclick=()=>{current=(current+1)%3;render()}
    document.addEventListener('keydown',e=>{if(document.activeElement?.matches('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'){current=(current+2)%3;render()}if(e.key==='ArrowRight'){current=(current+1)%3;render()}})
    render()
  </script>
</body>
</html>
