function templates(){var dollar="$";return '<main class="main"><div class="heading"><div><h1>报文模板</h1><p>合法 JSON + JSONPath 类型化绑定；发布后不可变。</p></div><button class="primary" data-act="newtemplate">＋ 新建模板</button></div><div class="grid two"><section class="card"><div class="head"><h2>weather_station_message · v3</h2>'+st("成功")+'</div><pre class="code">{ "metadata": { "messageId": "'+dollar+'{uuid}", "createTime": "'+dollar+'{now + 0m}" }, "records": [{ "stcd": '+dollar+'{station_code}, "temperature": '+dollar+'{temperature} }] }</pre><div class="actions" style="margin-top:14px"><button class="primary" data-act="preview">▶ 生成预览</button><button class="secondary" data-act="publish">发布新版本</button><button class="secondary" data-act="bindings">变量绑定（4）</button></div></section><section class="card"><h2>变量绑定</h2><table class="table"><thead><tr><th>位置</th><th>提供者</th><th>类型</th><th>策略</th></tr></thead><tbody><tr><td>$.metadata.messageId</td><td>UUID</td><td>string</td><td>FAIL</td></tr><tr><td>$.records[0].stcd</td><td>要素：站点编码</td><td>integer</td><td>FAIL</td></tr><tr><td>$.records[0].temperature</td><td>要素：气温</td><td>number</td><td>SKIP</td></tr><tr><td>$.metadata.createTime</td><td>now + offset</td><td>datetime</td><td>FAIL</td></tr></tbody></table><div class="preview"><b>校验通过</b><br>合法 JSON · 4 个绑定可解析 · 估算大小 1.8 KB</div></section></div></main>'}
function elements(){return '<main class="main"><div class="heading"><div><h1>要素与数据</h1><p>业务数据来源与 PostgreSQL DatasetProvider 分离。</p></div><button class="primary" data-act="newelement">＋ 新建要素</button></div><div class="grid two"><section class="card"><h2>业务数据来源</h2><table class="table"><thead><tr><th>编码</th><th>名称</th><th>状态</th></tr></thead><tbody><tr><td>2002332</td><td>江苏物联管理中心</td><td>'+st("成功")+'</td></tr><tr><td>2002441</td><td>河北物联管理中心</td><td>'+st("成功")+'</td></tr></tbody></table></section><section class="card"><h2>PostgreSQL DatasetProvider</h2><p>受控视图：<b>weather_station_reading</b><br>分页预取 1,000 行，最大缓存 5,000 行。</p><button class="secondary" data-act="connection">测试连接</button></section></div><section class="card" style="margin-top:16px"><div class="head"><h2>已发布要素</h2><button class="secondary" data-act="filter">来源：全部</button></div><table class="table"><thead><tr><th>要素</th><th>业务数据来源</th><th>Dataset 字段</th><th>类型</th><th>版本</th></tr></thead><tbody><tr><td>站点编码</td><td>江苏物联管理中心</td><td>station_code</td><td>integer</td><td>v2</td></tr><tr><td>气温</td><td>江苏物联管理中心</td><td>temperature</td><td>number</td><td>v5</td></tr><tr><td>观测时间</td><td>河北物联管理中心</td><td>observed_at</td><td>datetime</td><td>v1</td></tr></tbody></table></section></main>'}
